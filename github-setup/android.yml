name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Tend.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Tend-apk
          path: Tend.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tend 1.0.${{ github.run_number }}
          make_latest: true
          files: Tend.apk
          body: |
            Install on Android: download Tend.apk, open it, and allow installs from your browser or Files app if asked.
            Each new build installs over the previous one and keeps your data.
